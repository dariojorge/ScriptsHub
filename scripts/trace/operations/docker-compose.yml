services:
  # Jaeger Service (for trace visualization)
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI (Web interface)
      - "14250:14250"  # Jaeger gRPC endpoint (for traces)
      - "14268:14268"  # Jaeger HTTP endpoint for traces
    networks:
      - otel-jaeger-network

  # Amazon OpenTelemetry Collector Service
  aws-otel-collector:
    image: amazon/aws-otel-collector:v0.42.0
    container_name: aws-otel-collector
    ports:
      - "1777:1777"   # pprof extension
      - "55679:55679" # zpages extension
      - "4317:4317" # OTLP receiver
      - "13133"       # health_check
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml  # Mount your custom config
    environment:
      - AWS_REGION=eu-central-1
      - OTEL_RESOURCE_ATTRIBUTES=service.name=otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    depends_on:
      - jaeger
    networks:
      - otel-jaeger-network

networks:
  otel-jaeger-network:
    driver: bridge